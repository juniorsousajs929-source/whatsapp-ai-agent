<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Proyecto D22</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #FF2E63;
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Optimized for Mobile view */
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .headline {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInBody 1s ease;
        }

        .headline h2 {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .headline h2 span {
            color: var(--primary);
        }

        .headline p {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpCard 0.8s forwards;
            overflow: hidden;
        }

        .card:nth-child(1) { animation-delay: 0.2s; }
        .card:nth-child(2) { animation-delay: 0.4s; }
        .card:nth-child(3) { animation-delay: 0.6s; }
        .card:nth-child(4) { animation-delay: 0.8s; }
        .card:nth-child(5) { animation-delay: 1.0s; }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:active img {
            transform: scale(0.98);
        }

        .floating-cta {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 440px;
            background: linear-gradient(135deg, #FF2E63 0%, #db1f4e 100%);
            color: white;
            text-align: center;
            padding: 18px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(255, 46, 99, 0.4);
            z-index: 100;
            animation: pulseCTA 2s infinite;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUpCard {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseCTA {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 10px 25px rgba(255, 46, 99, 0.4); }
            50% { transform: translateX(-50%) scale(1.02); box-shadow: 0 15px 35px rgba(255, 46, 99, 0.6); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 10px 25px rgba(255, 46, 99, 0.4); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dra. Alicia</h1>
            <p>Especialista en Nutrición</p>
        </header>

        <main>
            <div class="headline">
                <h2>Mira lo que logran nuestras alumnas con el <span>Proyecto D22</span></h2>
                <p>Resultados 100% reales de personas como tú que decidieron transformar su vida con la desintoxicación.</p>
            </div>

            <section class="gallery">
                <div class="card">
                    <img src="images/print1.jpg" alt="Resultado de alumna">
                </div>
                <div class="card">
                    <img src="images/print2.jpg" alt="Resultado de alumna">
                </div>
                <div class="card">
                    <img src="images/print3.jpg" alt="Resultado de alumna">
                </div>
                <div class="card">
                    <img src="images/print4.jpg" alt="Resultado de alumna">
                </div>
                <div class="card">
                    <img src="images/print5.jpg" alt="Resultado de alumna">
                </div>
            </section>
        </main>
    </div>

    <!-- The link can just trigger a window close or return to Whatsapp if they used the URL directly -->
    <a href="javascript:history.back()" class="floating-cta">Quiero mi Transformación Ahora →</a>

</body>
</html>
